[package]
name = "boxqu"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
# Gemeinsamer Unterbau (Theme, Icons, Animationen, Suche, Upscaling …).
qu-core = { git = "https://github.com/simonroqu/quCore", tag = "v0.3.0" }
async-channel = "2"
base64 = "0.22"
# MovieBox-Signatur (HMAC-MD5)
hmac = "0.13"
md-5 = "0.11"
gtk4 = { version = "0.11", features = ["v4_20"] }
libloading = "0.9.0"
libmpv2 = "7"
libmpv2-sys = "4"
reqwest = "0.12"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs", "process", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "time", "sync", "rt-multi-thread"] }
